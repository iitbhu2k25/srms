x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-srms}
  POSTGRES_USER: ${POSTGRES_USER:-srms}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srms}

# Ports differ from the Carbon Dashboard (8000 / 5432 / 3000) so both stacks can run on one machine.
services:
  fast_backend:
    build:
      context: ./fast_backend
    image: srms-fast-backend
    environment:
      <<: *postgres-env
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      # Dummy-data simulator keeps appending readings; set false once real devices push data.
      SIMULATE_LIVE: ${SIMULATE_LIVE:-true}
    volumes:
      # Code mounted like the Carbon Dashboard, so migrations generated by start.sh land in the project.
      - ./fast_backend:/home/app
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  database:
    image: postgis/postgis:17-3.5-alpine
    environment:
      <<: *postgres-env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - srms_pgdata:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/zz-init-databases.sql:ro
    healthcheck:
      # Over TCP: during first-time initialisation Postgres only listens on its Unix socket and then restarts,
      # so a socket check reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     # The Next.js server proxies /api/* to the backend (src/app/api/[...path]/route.ts).
  #     args:
  #       API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #   image: srms-frontend
  #   environment:
  #     API_URL: ${FRONTEND_API_URL:-http://fast_backend:8000}
  #   ports:
  #     - "${WEB_PORT:-3010}:3000"
  #   depends_on:
  #     fast_backend:
  #       condition: service_healthy
  #   restart: unless-stopped

  # Writes every service's output to ./logs/<service>.log and ./logs/all.log
  # (rotated at 10 MB, 5 old copies kept). See logs/collect-logs.sh.
  log_collector:
    image: docker:27-cli
    entrypoint: ["sh", "/logs/collect-logs.sh"]
    environment:
      LOG_SERVICES: fast_backend database
      LOG_MAX_BYTES: 10485760
      LOG_KEEP: 5
      # Host user that should own the log files.
      LOG_OWNER: ${LOG_OWNER:-1000:1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    restart: unless-stopped

volumes:
  srms_pgdata:
